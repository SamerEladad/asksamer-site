<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Ask Samer</title>
<meta name="viewport" content="width=device-width, initial-scale=1" />

<style>
* { box-sizing: border-box; margin: 0; padding: 0; }

body {
  font-family: system-ui, -apple-system, BlinkMacSystemFont, "SF Pro Text", sans-serif;
  background: #ffffff;
  color: #111827;
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  position: relative;
  overflow: hidden;
}

main {
  position: relative;
  z-index: 2;
  text-align: center;
  padding: 24px;
  max-width: 420px;
}

h1 {
  font-size: 2.4rem;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  font-weight: 500;
  margin-bottom: 10px;
}

.arabic {
  font-size: 1.1rem;
  color: #4b5563;
  margin-bottom: 22px;
  direction: rtl;
}

.dots {
  display: inline-flex;
  gap: 8px;
  margin-bottom: 24px;
}

.dot {
  width: 8px;
  height: 8px;
  border-radius: 999px;
  background: #9ca3af;
  opacity: 0.4;
  animation: bounce 1.2s infinite ease-in-out;
}

.dot:nth-child(2) { animation-delay: 0.15s; }
.dot:nth-child(3) { animation-delay: 0.3s; }

@keyframes bounce {
  0%, 80%, 100% { transform: translateY(0); opacity: 0.3; }
  40% { transform: translateY(-6px); opacity: 1; }
}

nav a {
  display: block;
  margin-top: 12px;
  font-size: 0.95rem;
  color: #111827;
  text-decoration: none;
  font-weight: 500;
}

.social {
  margin-top: 22px;
  display: flex;
  justify-content: center;
  gap: 16px;
}

.social a {
  text-decoration: none;
  color: #111827;
  font-size: 0.9rem;
  display: flex;
  align-items: center;
  gap: 6px;
}

/* FLAG BACKGROUND */

.flag-bg {
  position: fixed;
  inset: 0;
  display: flex;
  z-index: 0;
  pointer-events: none;
  opacity: 0.12;
}

.column {
  flex: 1;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 26px;
  font-size: 18px;
  animation: floatUp 45s linear infinite;
}

.column.down {
  animation: floatDown 50s linear infinite;
}

@keyframes floatUp {
  from { transform: translateY(0); }
  to { transform: translateY(-50%); }
}

@keyframes floatDown {
  from { transform: translateY(-50%); }
  to { transform: translateY(0); }
}
</style>
</head>

<body>

<div class="flag-bg">
  <div class="column">
    🇪🇬 🇸🇦 🇦🇪 🇯🇴 🇵🇸 🇱🇧 🇸🇾 🇮🇶 🇩🇪 🇰🇼 🇶🇦 🇧🇭 🇴🇲 🇾🇪 🇲🇦 🇩🇿
  </div>
  <div class="column down">
    🇹🇳 🇱🇾 🇸🇩 🇲🇷 🇸🇴 🇩🇪 🇩🇯 🇰🇲 🇪🇬 🇸🇦 🇦🇪 🇩🇪
  </div>
  <div class="column">
    🇱🇧 🇸🇾 🇮🇶 🇰🇼 🇶🇦 🇧🇭 🇩🇪 🇴🇲 🇾🇪 🇲🇦 🇩🇿 🇹🇳
  </div>
  <div class="column down">
    🇸🇩 🇲🇷 🇸🇴 🇩🇯 🇰🇲 🇩🇪 🇪🇬 🇸🇦 🇦🇪 🇯🇴 🇵🇸
  </div>
</div>

<main>
  <h1>Ask Samer</h1>
  <div class="arabic">دليلك لألمانيا</div>

  <div class="dots">
    <div class="dot"></div>
    <div class="dot"></div>
    <div class="dot"></div>
  </div>

  <nav>
    <a href="book.html">Book a Call</a>
    <a href="links.html">Links & Resources</a>
  </nav>

  <div class="social">
    <a href="https://instagram.com/asksamer.de" target="_blank">📸 @asksamer.de</a>
    <a href="https://tiktok.com/@asksamer.de" target="_blank">🎵 @asksamer.de</a>
  </div>
</main>

</body>
</html>
