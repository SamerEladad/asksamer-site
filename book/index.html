<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Book a Call – Ask Samer</title>
<meta name="viewport" content="width=device-width, initial-scale=1" />

<style>
/* SAME BASE STYLES AS HOME */
* { box-sizing: border-box; margin: 0; padding: 0; }

body {
  font-family: system-ui, sans-serif;
  min-height: 100vh;
  overflow: hidden;
  background: #f3f4f6;
  color: #111827;
}

.flag-bg { position: fixed; inset: 0; display: flex; z-index: 0; opacity: 0.12; }
.column { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 24px; font-size: 18px; animation: floatUp 38s linear infinite; }
.column.down { animation: floatDown 42s linear infinite; }

@keyframes floatUp { from { transform: translateY(0); } to { transform: translateY(-50%); } }
@keyframes floatDown { from { transform: translateY(-50%); } to { transform: translateY(0); } }

.wrap { position: relative; z-index: 1; min-height: 100vh; display: flex; align-items: center; justify-content: center; text-align: center; padding: 24px; }

h1 { font-size: 2rem; margin-bottom: 10px; }
.arabic { color: #4b5563; margin-bottom: 22px; direction: rtl; }

.dots { display: inline-flex; gap: 8px; margin-bottom: 28px; }
.dot { width: 8px; height: 8px; border-radius: 999px; background: #9ca3af; opacity: 0.4; animation: bounce 1.2s infinite ease-in-out; }
.dot:nth-child(2) { animation-delay: 0.15s; }
.dot:nth-child(3) { animation-delay: 0.3s; }

@keyframes bounce {
  0%, 80%, 100% { transform: translateY(0); opacity: 0.3; }
  40% { transform: translateY(-6px); opacity: 1; }
}

a { color: #111827; text-decoration: none; font-weight: 500; font-size: 0.9rem; }
</style>
</head>

<body>

<div class="flag-bg">
  <div class="column">🇩🇪 🇩🇪 🇪🇬 🇩🇪 🇩🇪 🇸🇦</div>
  <div class="column down">🇩🇪 🇦🇪 🇩🇪 🇯🇴 🇩🇪</div>
  <div class="column">🇩🇪 🇩🇪 🇪🇬 🇩🇪</div>
</div>

<div class="wrap">
  <div>
    <h1>Book a Call</h1>
    <div class="arabic">قريبًا جدًا</div>

    <div class="dots">
      <div class="dot"></div>
      <div class="dot"></div>
      <div class="dot"></div>
    </div>

    <a href="/">← Back to Home</a>
  </div>
</div>

</body>
</html>
