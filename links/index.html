<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Links – Ask Samer</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: system-ui, sans-serif;
      background: #ffffff;
      color: #111827;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .wrap {
      text-align: center;
      padding: 24px;
      max-width: 420px;
      width: 100%;
    }

    h1 {
      font-size: 2rem;
      margin-bottom: 12px;
    }

    .arabic {
      color: #4b5563;
      margin-bottom: 22px;
      direction: rtl;
    }

    .dots {
      display: inline-flex;
      gap: 8px;
      margin-bottom: 28px;
    }

    .dot {
      width: 8px;
      height: 8px;
      border-radius: 999px;
      background: #9ca3af;
      opacity: 0.4;
      animation: bounce 1.2s infinite ease-in-out;
    }

    .dot:nth-child(2) { animation-delay: 0.15s; }
    .dot:nth-child(3) { animation-delay: 0.3s; }

    @keyframes bounce {
      0%, 80%, 100% { transform: translateY(0); opacity: 0.3; }
      40% { transform: translateY(-6px); opacity: 1; }
    }

    a {
      display: inline-block;
      margin-top: 20px;
      color: #111827;
      text-decoration: none;
      font-weight: 500;
    }
  </style>
</head>

<body>
  <main class="wrap">
    <h1>Links</h1>
    <div class="arabic">روابط مفيدة قريبًا</div>

    <div class="dots">
      <div class="dot"></div>
      <div class="dot"></div>
      <div class="dot"></div>
    </div>

    <a href="/">← Back to Home</a>
  </main>
</body>
</html>
